services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: host
    environment:
      TZ: America/New_York
    volumes:
      - ./config:/config
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
